version: "3"
services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 80:80
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/airgo3d
  mongodb:
    image: mongo:7
    container_name: airgo3d-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=airgo3d
volumes:
  mongodb_data:
